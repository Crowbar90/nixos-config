name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      - name: Trust flake nixConfig substituters
        run: |
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<'EOF'
          extra-substituters = https://niri.cachix.org https://noctalia.cachix.org
          extra-trusted-public-keys = niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
          EOF

      - name: Run alejandra
        uses: kamadorueda/alejandra@4.0.0
        with:
          args: --check .

      - name: Run nix flake check
        run: nix flake check --all-systems

  build-dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [midgar, latitude7420, xps9343]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      - name: Trust flake nixConfig substituters
        run: |
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<'EOF'
          extra-substituters = https://niri.cachix.org https://noctalia.cachix.org
          extra-trusted-public-keys = niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
          EOF

      - name: Dry-run build for ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --dry-run
